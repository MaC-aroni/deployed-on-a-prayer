app = "deployed-on-a-prayer"
primary_region = "lax" # min_machines_running only applies to the primary region

# A deploy or stop waits this long for the app to exit, so a Terraform step in flight can finish
# instead of leaving half-made resources and a stale state lock behind.
kill_signal = "SIGINT"
kill_timeout = "300s"

[env]
  APP_ENV = "production"
  MAC_DATA_DIR = "/data" # run history, tickets and page ids; on the volume so deploys keep them

[mounts]
  source = "mac_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm so the demo never waits on a cold start.
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  # Terraform with the AWS provider needs several hundred MB on its own.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
