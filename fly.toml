app = "deployed-on-a-prayer"
primary_region = "lax" # min_machines_running only applies to the primary region

# The Deploy workflow waits for running work before restarting, so a shutdown is normally
# instant. This only bounds the downtime if the app is stopped while busy anyway (agent jobs run
# on daemon threads and never hold it up; a Terraform step gets this long to finish).
kill_signal = "SIGINT"
kill_timeout = "60s"

[env]
  APP_ENV = "production"
  MAC_DATA_DIR = "/data" # run history, tickets and page ids; on the volume so deploys keep them

[mounts]
  source = "mac_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm so the demo never waits on a cold start.
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  # Terraform with the AWS provider needs several hundred MB on its own.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
