# Exact tool versions for this project. `mise install` fetches them; inside this folder
# (and in every `mise run` task) they replace whatever Node/Python the machine has.
[tools]
node = "22.23.4"
python = "3.12.16"
uv = "0.10.2"
terraform = "1.17.1"

# Same commands on macOS, Linux and Windows.
[tasks.setup]
description = "Install frontend and backend dependencies, create backend/.env"
run = "python scripts/setup.py"

[tasks.dev]
description = "Run the frontend against the live backend on Fly"
run = "python scripts/dev.py"

[tasks.dev-local]
description = "Run the backend and frontend on this machine"
run = "python scripts/dev.py --local"

[tasks.mac]
description = "The MaC runner CLI, e.g. `mise run mac validate examples/claims-adjudication/migration.yaml`"
run = "python scripts/in_venv.py -m mac"

[tasks.mac-jira-webhook]
description = "Make approvals instant: set a webhook secret on Fly and register the Jira webhook (rotates it if run again)"
run = "python scripts/in_venv.py scripts/jira_webhook.py"

[tasks.mac-unlock]
description = "Remove stale Terraform state locks left in S3 by a run that was killed (only when nothing is running)"
run = "python scripts/in_venv.py scripts/unlock_tf_state.py"

[tasks.test]
description = "Run the backend tests"
run = "python scripts/in_venv.py -m pytest backend"

[tasks.lock]
description = "Re-pin backend packages after editing backend/requirements*.in"
run = [
  "uv pip compile -q --universal --python-version 3.12 backend/requirements.in -o backend/requirements.txt",
  "uv pip compile -q --universal --python-version 3.12 backend/requirements-dev.in -o backend/requirements-dev.txt",
]
