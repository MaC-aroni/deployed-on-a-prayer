name: Deploy

# Every merge to main deploys. A maintainer can also click "Run workflow" on main (Actions → Deploy).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a second click waits for the first to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A merge to main (it passed CI as a PR), or a maintainer's manual run on main.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || contains(fromJSON('["ob1-can-obi", "Elathius", "Zafeer-R"]'), github.actor))
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # No waiting: a deploy restarts the one machine at once. A Build, Rehearse or Deploy cut off
      # by it is undone when the server comes back; an agent run (plan, learn) is marked failed.

      # App keys live in Fly's secret store (fly secrets / the Fly dashboard), not here.
      # flyctl comes from GitHub's release downloads, which 504 now and then (for an hour, once);
      # when that happens, the same deploy runs from flyctl's Docker image instead.
      - name: Deploy to Fly
        run: |
          if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors https://fly.io/install.sh | sh; then
            "$HOME/.fly/bin/flyctl" deploy --remote-only --ha=false
          else
            echo "::warning::flyctl download failed; deploying with the flyctl Docker image instead"
            docker run --rm -v "$PWD:/app" -w /app -e FLY_API_TOKEN \
              flyio/flyctl:v0.5.5 deploy --remote-only --ha=false
          fi

      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://deployed-on-a-prayer.fly.dev/api/health
          curl -fsS -o /dev/null https://deployed-on-a-prayer.fly.dev/excuses
