name: CI

# Build checks on every push to every branch, on GitHub's machines.
# Deliberately no pull_request trigger: fork PRs on this public repo run nothing.
on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # same Node/Python as mise.toml
      - run: pip install -r requirements.txt ruff
      - name: Lint (real errors only, not style)
        run: python -m ruff check --select E9,F63,F7,F82 . ../scripts
      - name: App imports
        run: python -c "from app.main import app"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI directly: the gitleaks GitHub Action needs a paid license for orgs.
      - name: Scan full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose
