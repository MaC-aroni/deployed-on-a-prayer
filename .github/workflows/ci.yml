name: CI

# Build checks on every push to every branch, on GitHub's machines.
# Deliberately no pull_request trigger: fork PRs on this public repo run nothing.
on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # same Node/Python as mise.toml
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (real errors only, not style)
        run: python -m ruff check --select E9,F63,F7,F82 . ../scripts
      - name: App imports
        run: python -c "from app.main import app"
      - name: Tests
        run: python -m pytest -q
      - name: Example migrations are valid
        run: for spec in ../examples/*/migration.yaml; do python -m mac validate "$spec"; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI directly: the gitleaks GitHub Action needs a paid license for orgs.
      - name: Scan full history for secrets
        run: |
          # GitHub's release downloads 504 now and then (for an hour, once). Retry, and if the
          # release is still unreachable, run the same gitleaks version from its Docker image.
          if curl -sSfL --retry 4 --retry-delay 5 --retry-all-errors \
               -o "$RUNNER_TEMP/gitleaks.tgz" \
               https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz; then
            tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
            "$RUNNER_TEMP/gitleaks" git . --redact --verbose
          else
            echo "::warning::GitHub release download failed; scanning with the gitleaks Docker image instead"
            docker run --rm -v "$PWD:/repo" -w /repo \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
          fi
